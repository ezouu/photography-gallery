<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Photographs</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="gallery.js"></script>
  </head>
  <body>
    <aside class="sidebar" aria-label="Gallery position">
      <nav aria-label="Gallery contents">
        <ol id="gallery-nav">
          <li><a href="#quote" aria-label="Opening quote" aria-current="location"></a></li>
        </ol>
      </nav>
    </aside>
    <main id="gallery" class="gallery" tabindex="0" aria-label="Photography gallery. Scroll to move between photographs.">
      <section id="quote" class="frame quote-frame" aria-label="Opening quote">
        <p class="quote">the only advice that is objectively true is “take more pictures”</p>
      </section>
    </main>
    <p class="loading-note">Images may take a moment to load.</p>
    <span id="announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
  </body>
</html>
